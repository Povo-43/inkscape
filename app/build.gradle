plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.inkscape.inkscape'
    compileSdk 35

    defaultConfig {
        applicationId 'org.inkscape.inkscape'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.5-dev'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Enable native (C/C++) builds and select the NDK to use.
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -frtti -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk {
            // Build all supported ABIs for maximum device compatibility.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // リリース署名は CI シークレット (RELEASE_*) から注入。未設定の場合は
            // デフォルトのデバッグ署名でビルドする（リリースアップロード用には
            // シークレット設定が必要）。
            def _releaseStoreFile = System.getenv('RELEASE_STORE_FILE')
            if (_releaseStoreFile) {
                signingConfigs.create('release') {
                    storeFile file(_releaseStoreFile)
                    storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
                    keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: ''
                    keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: ''
                }
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Point the C++ sources at the shared Inkscape native library built by the
    // top-level CMakeLists.txt (ANDROID => SHARED .so).  Gradle packages the
    // resulting .so into the APK automatically.
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs('src/main/jniLibs')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
