[package]
name = "inkscape-svg-renderer"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Android 向け SVG レンダリングエンジン (resvg ベース) for Inkscape"

[lib]
name = "inkscape_svg_renderer"
crate-type = ["staticlib", "rlib"]

[dependencies]
# resvg は SVG の解析 (usvg) と描画 (tiny-skia) を提供する純 Rust 実装。
# Android NDK 向けクロスコンパイルが容易で、C ライブラリ依存がない。
resvg = { version = "0.49", default-features = false, features = [
    "text",
    "system-fonts",
    "svgz",
    "raster-images",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
