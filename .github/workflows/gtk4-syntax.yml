# GTK4 アプリのソースを、Android ビルド (pixiewood) を待たずに
# ホストの GTK4 ヘッダで型チェックするための軽量ワークフロー。
#
# pixiewood での Android ビルドは GTK 本体のクロスコンパイルを含むため
# 数十分かかる。コンパイルエラーを数分で検出するためにこちらを使う。
name: GTK4 Syntax Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/android-gtk4/src/**'
      - 'packaging/android-gtk4/tests/**'
      - 'packaging/android-gtk4/meson.build'
      - '.github/workflows/gtk4-syntax.yml'

jobs:
  syntax:
    name: ホスト GTK4 でコンパイルチェック
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GTK4 開発パッケージをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            xvfb
          pkg-config --modversion gtk4

      - name: 構文チェック
        run: |
          cd packaging/android-gtk4
          set -x
          g++ -std=c++17 -fsyntax-only -Wall -Wextra \
            $(pkg-config --cflags gtk4) \
            src/main.cpp src/ink-canvas.cpp src/ink-document.cpp

      - name: meson でホストビルド (リンクまで確認)
        run: |
          python3 -m pip install --user meson ninja
          cd packaging/android-gtk4
          meson setup builddir
          meson compile -C builddir

      # SVG の読み込みと PNG 書き出しを自動テストする。
      # GtkSvg は GTK の初期化にディスプレイを要求するため xvfb を使う。
      - name: SVG 読み込み / PNG 書き出しテスト
        run: |
          cd packaging/android-gtk4
          xvfb-run -a meson test -C builddir --print-errorlogs

      - name: 生成された PNG を検証
        run: |
          cd packaging/android-gtk4
          python3 - <<'PY'
          import struct, sys

          path = "builddir/render-test.png"
          with open(path, "rb") as f:
              data = f.read()

          assert data[:8] == b"\x89PNG\r\n\x1a\n", "PNG シグネチャが不正"
          assert data[12:16] == b"IHDR", "IHDR がない"
          width, height = struct.unpack(">II", data[16:24])
          print(f"PNG: {width} x {height} px, {len(data)} bytes")

          # tests/sample.svg は 600 x 800
          assert (width, height) == (600, 800), f"サイズが想定外: {width}x{height}"
          # 真っ白でないこと (何か描かれていること) をざっくり確認
          assert len(data) > 1000, "PNG が小さすぎる"
          PY
