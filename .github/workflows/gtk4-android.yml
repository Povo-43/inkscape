# GTK4 ネイティブ版 Inkscape for Android をビルドする。
#
# これまでの Kotlin/Android View 版とは別に、GTK4 の Android バックエンド
# (GTK 4.22 以降) を使って GTK4 ウィジェットをそのまま動かす。
# ビルドには pixiewood (gtk-android-builder) を使う。
name: GTK4 Android

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packaging/android-gtk4/**'
      - '.github/workflows/gtk4-android.yml'
    tags:
      - 'inkscape-gtk4-android-*'

concurrency:
  group: gtk4-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: GTK4 APK ビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # pixiewood 本体 (GTK Android Builder)
      - name: pixiewood をチェックアウト
        uses: actions/checkout@v4
        with:
          repository: sp1ritCS/gtk-android-builder
          ref: 001bfc0cae770438cc051458afc455564e83e3aa
          path: pixiewood

      # pixiewood のアイコン変換 (Svg2Avd) が必要とする Android Studio の
      # 最小サブセット。
      - name: mini-studio をチェックアウト
        uses: actions/checkout@v4
        with:
          repository: sp1ritCS/mini-studio
          ref: 8c2901968b07245ad07c1b38270928a49a510765
          path: mini

      - name: ビルド依存パッケージをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            glslc \
            gobject-introspection \
            gir1.2-appstream-1.0 \
            libglib2.0-dev \
            libglib2.0-dev-bin \
            libglib-perl \
            libglib-object-introspection-perl \
            libipc-run-perl \
            libjson-perl \
            libset-scalar-perl \
            libxml-libxml-perl \
            libxml-libxslt-perl \
            libxml2-utils \
            sassc \
            gettext \
            desktop-file-utils \
            apksigner

      - name: JDK 21 をセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Android SDK / NDK をセットアップ
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: Meson / Ninja をセットアップ
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install meson ninja
          meson --version
          ninja --version

      - name: pixiewood を PATH に追加
        run: echo "$GITHUB_WORKSPACE/pixiewood" >> "$GITHUB_PATH"

      # GTK を毎回ダウンロードしないよう、wrap の tarball をキャッシュする。
      - name: subprojects のダウンロードをキャッシュ
        uses: actions/cache@v4
        with:
          path: packaging/android-gtk4/subprojects/packagecache
          key: gtk4-wrap-${{ hashFiles('packaging/android-gtk4/pixiewood.xml') }}

      # GTK 本体の再コンパイルを高速化する。
      - name: ccache を復元
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: gtk4-ccache-${{ hashFiles('packaging/android-gtk4/pixiewood.xml') }}-v1

      - name: ccache を設定
        run: |
          ccache --max-size=2G
          ccache --version
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # pixiewood が生成するクロスファイルのコンパイラを ccache 経由にする。
      - name: クロスファイルに ccache を挿入
        run: |
          python3 - <<'PY'
          import re
          path = "pixiewood/prepare/android.cross"
          src = open(path).read()
          for key in ("c", "cpp"):
              src = re.sub(rf"^{key}(\s+)= (.*)$",
                           lambda m: f"{key}{m.group(1)}= ['ccache', {m.group(2)}]",
                           src, flags=re.M)
          open(path, "w").write(src)
          PY
          grep -n "ccache" pixiewood/prepare/android.cross

      - name: pixiewood prepare
        run: |
          pixiewood -C packaging/android-gtk4 prepare \
            --release \
            --android-studio=./mini \
            --sdk="$ANDROID_HOME" \
            packaging/android-gtk4/pixiewood.xml

      - name: pixiewood generate
        run: pixiewood -C packaging/android-gtk4 generate

      - name: pixiewood build
        run: pixiewood -C packaging/android-gtk4 build

      - name: ccache の統計
        if: always()
        run: ccache --show-stats || true

      - name: meson ログ (失敗時)
        if: failure()
        run: |
          for log in packaging/android-gtk4/.pixiewood/bin-*/meson-logs/meson-log.txt; do
            echo "===== $log ====="
            tail -n 200 "$log" || true
          done

      # pixiewood の生成する Gradle は release ビルドを署名しないため、
      # ここで署名する。RELEASE_KEYSTORE_BASE64 などのシークレットがあれば
      # リリース鍵を、なければデバッグ鍵を使う。
      - name: APK に署名
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            KS_PASS="$RELEASE_KEYSTORE_PASSWORD"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            KEY_PASS="$RELEASE_KEY_PASSWORD"
          else
            KEYSTORE="$RUNNER_TEMP/debug.keystore"
            KS_PASS="android"
            KEY_ALIAS="androiddebugkey"
            KEY_PASS="android"
            keytool -genkeypair -keystore "$KEYSTORE" \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          mkdir -p signed
          shopt -s nullglob
          for apk in packaging/android-gtk4/.pixiewood/android/app/build/outputs/apk/release/*-unsigned.apk; do
            aligned="${apk%-unsigned.apk}-aligned.apk"
            out="signed/$(basename "${apk%-unsigned.apk}").apk"
            "$BT/zipalign" -f -p 4 "$apk" "$aligned"
            "$BT/apksigner" sign \
              --ks "$KEYSTORE" --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" \
              --out "$out" "$aligned"
          done
          ls -l signed

      - name: APK をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: gtk4-apk
          path: signed/*.apk
          if-no-files-found: error

  release:
    name: リリース作成と APK アップロード
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: APK をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: gtk4-apk
          path: apk

      - name: gh release にアップロード
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Inkscape GTK4 for Android $TAG" \
              --notes "GTK4 ネイティブ版 Inkscape for Android (実験的ビルド)。

          - UI: GTK4 (Android バックエンド)
          - レンダリング: GtkSvg (GTK 4.22+)
          - SVG / SVGZ を開く、PNG を書き出す (1× / 2× / 4×)
          - ピンチズーム / ドラッグパン / ページにフィット
          - ファイルマネージャから image/svg+xml を「開く」に対応
          - 対応: Android 12 以降 (minSdk 31)
          - インストール: APK をタップしてサイドロードしてください (デバッグ署名)。"
          fi
          gh release upload "$TAG" apk/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
