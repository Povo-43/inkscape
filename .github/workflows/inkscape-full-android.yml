# Inkscape 完全版 (C++ コア) for Android をビルドする。
#
# pixiewood による GTK4 + gtkmm4 スタックのクロスビルドに加えて、
# Inkscape 本体の C++ ソースコードを Android 向けにクロスコンパイルし、
# 共有ライブラリ (libinkscape_core.so) として APK に同梱する。
#
# ビルドステージ:
#   1. GTK4 スタック (pixiewood: gtk4, pango, cairo, gdk-pixbuf, glib 等)
#   2. mm ライブラリ (pixiewood wrap: sigc++, glibmm, cairomm, pangomm, gtkmm)
#   3. Inkscape 依存 (2geom, boost, gsl, lcms2, libxml2, libcroco 等)
#   4. Inkscape C++ コアのクロスコンパイル
#   5. APK パッケージング
name: Inkscape Full Android

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [master]
    paths:
      - 'packaging/inkscape-full-android/**'
      - '.github/workflows/inkscape-full-android.yml'
    tags:
      - 'inkscape-full-android-*'

concurrency:
  group: inkscape-full-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_API: 31
  ANDROID_ABI: arm64-v8a
  ANDROID_TRIPLE: aarch64-linux-android

jobs:
  # ============================================================
  # Stage 1: GTK4 + gtkmm4 スタックを pixiewood でビルド
  # ============================================================
  build-gtk4-stack:
    name: GTK4 スタック (pixiewood)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: pixiewood をチェックアウト
        uses: actions/checkout@v4
        with:
          repository: sp1ritCS/gtk-android-builder
          ref: 001bfc0cae770438cc051458afc455564e83e3aa
          path: pixiewood

      - name: mini-studio をチェックアウト
        uses: actions/checkout@v4
        with:
          repository: sp1ritCS/mini-studio
          ref: 8c2901968b07245ad07c1b38270928a49a510765
          path: mini

      - name: ビルド依存パッケージをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache glslc \
            gobject-introspection gir1.2-appstream-1.0 \
            libglib2.0-dev libglib2.0-dev-bin \
            libglib-perl libglib-object-introspection-perl \
            libipc-run-perl libjson-perl \
            libset-scalar-perl libxml-libxml-perl libxml-libxslt-perl \
            libxml2-utils sassc gettext desktop-file-utils apksigner

      - name: JDK 21 をセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Android SDK / NDK をセットアップ
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: libc++_shared.so を配置
        run: |
          set -euo pipefail
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          HOST_TAG=linux-x86_64
          for pair in "arm64-v8a:aarch64-linux-android" "x86_64:x86_64-linux-android"; do
            abi="${pair%%:*}"
            triple="${pair##*:}"
            mkdir -p "packaging/android-gtkmm4/libcxx/$abi"
            cp "$NDK/toolchains/llvm/prebuilt/$HOST_TAG/sysroot/usr/lib/$triple/libc++_shared.so" \
               "packaging/android-gtkmm4/libcxx/$abi/"
          done

      - name: NDK ツールチェインを PATH に追加
        run: |
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/pkg-config" >> "$GITHUB_ENV"

      - name: Meson / Ninja をセットアップ
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install meson ninja

      - name: pixiewood を PATH に追加
        run: echo "$GITHUB_WORKSPACE/pixiewood" >> "$GITHUB_PATH"

      - name: subprojects のダウンロードをキャッシュ
        uses: actions/cache@v4
        with:
          path: packaging/android-gtkmm4/subprojects/packagecache
          key: gtk4-wrap-${{ hashFiles('packaging/android-gtkmm4/pixiewood.xml') }}

      - name: ccache を復元
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: gtk4-ccache-full-${{ hashFiles('packaging/android-gtkmm4/pixiewood.xml') }}-v2

      - name: ccache を設定
        run: |
          ccache --max-size=3G
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: クロスファイルに ccache と pkg-config を挿入
        run: |
          python3 - <<'PY'
          import re, glob
          path = "pixiewood/prepare/android.cross"
          src = open(path).read()
          for key in ("c", "cpp"):
              src = re.sub(rf"^{key}(\s+)= (.*)$",
                           lambda m: f"{key}{m.group(1)}= ['ccache', {m.group(2)}]",
                           src, flags=re.M)
          if 'pkg-config' not in src:
              ndk_pkgconfig = glob.glob('/usr/local/lib/android/sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/pkg-config')
              if ndk_pkgconfig:
                  pkg_path = ndk_pkgconfig[0]
                  if '[binaries]' in src:
                      src = src.replace('[binaries]', f'[binaries]\npkg-config = \'{pkg_path}\'')
                  else:
                      src = src + f'\n[binaries]\npkg-config = \'{pkg_path}\'\n'
          open(path, "w").write(src)
          PY

      - name: pixiewood prepare
        run: |
          pixiewood -C packaging/android-gtkmm4 prepare \
            --release \
            --android-studio=./mini \
            --sdk="$ANDROID_HOME" \
            packaging/android-gtkmm4/pixiewood.xml

      - name: pixiewood generate
        run: pixiewood -C packaging/android-gtkmm4 generate

      - name: pixiewood build
        run: pixiewood -C packaging/android-gtkmm4 build

      - name: ビルド出力ディレクトリの確認
        run: |
          echo "=== pixiewood ビルド後のディレクトリ構造 ==="
          ls -la packaging/android-gtkmm4/
          echo ""
          echo "=== .pixiewood ディレクトリ ==="
          ls -la packaging/android-gtkmm4/.pixiewood/ 2>/dev/null || echo ".pixiewood not found"
          echo ""
          echo "=== .pixiewood/root ==="
          ls -la packaging/android-gtkmm4/.pixiewood/root/ 2>/dev/null || echo "root not found"
          echo ""
          echo "=== .pixiewood/root/lib ==="
          ls -la packaging/android-gtkmm4/.pixiewood/root/lib/ 2>/dev/null || echo "lib not found"
          echo ""
          echo "=== .pixiewood/root/lib/arm64-v8a ==="
          ls -la packaging/android-gtkmm4/.pixiewood/root/lib/arm64-v8a/ 2>/dev/null || echo "arm64-v8a not found"
          echo ""
          echo "=== .so ファイルの検索 ==="
          find . -name "*.so" -path "*android*" | head -20
          echo ""
          echo "=== .a ファイルの検索 ==="
          find . -name "*.a" -path "*android*" | head -20
          echo ""
          echo "=== subprojects ビルド出力 ==="
          ls packaging/android-gtkmm4/subprojects/ 2>/dev/null
          echo ""
          echo "=== build ディレクトリ検索 ==="
          find . -maxdepth 3 -type d -name "build*" | head -10
          echo ""
          echo "=== meson ビルドディレクトリ ==="
          find . -maxdepth 3 -type d -name "bin-*" | head -10

      - name: GTK4 スタックをアーティファクトとしてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: gtk4-stack
          path: |
            packaging/android-gtkmm4/.pixiewood
            packaging/android-gtkmm4/subprojects
            packaging/android-gtkmm4/bin-*/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

      - name: meson ログ (失敗時)
        if: failure()
        run: |
          for log in packaging/android-gtkmm4/.pixiewood/bin-*/meson-logs/meson-log.txt; do
            echo "===== $log ====="
            tail -n 200 "$log" || true
          done

  # ============================================================
  # Stage 2: Inkscape 依存ライブラリ + C++ コアをビルド
  # ============================================================
  build-inkscape-core:
    name: Inkscape C++ コア
    needs: build-gtk4-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: リポジトリをチェックアウト（submodules 含む）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: GTK4 スタックをダウンロード
        uses: actions/download-artifact@v4
        with:
          name: gtk4-stack
          path: gtk4-stack-download

      - name: GTK4 スタックの確認
        run: |
          echo "=== Checking downloaded GTK4 stack ==="
          echo "=== Workspace root ==="
          ls -la
          echo "=== Download directory ==="
          ls -la gtk4-stack-download/
          echo "=== Checking for pixiewood in download dir ==="
          find gtk4-stack-download -name ".pixiewood" -type d 2>/dev/null | head -10
          echo "=== Checking pixiewood at download dir root ==="
          ls -la gtk4-stack-download/.pixiewood/ 2>/dev/null || echo ".pixiewood not found at download root"
          ls -la gtk4-stack-download/.pixiewood/root/ 2>/dev/null | head -20 || echo "root not found"
          ls -la gtk4-stack-download/.pixiewood/root/lib/ 2>/dev/null | head -20 || echo "root/lib not found"
          ls -la gtk4-stack-download/.pixiewood/root/lib/arm64-v8a/ 2>/dev/null | head -20 || echo "root/lib/arm64-v8a not found"
          echo "=== Checking pixiewood at packaging/android-gtkmm4/ in download dir ==="
          ls -la gtk4-stack-download/packaging/android-gtkmm4/.pixiewood/ 2>/dev/null || echo ".pixiewood not found at packaging/android-gtkmm4/"
          ls -la gtk4-stack-download/packaging/android-gtkmm4/.pixiewood/root/ 2>/dev/null | head -20 || echo "root not found"
          ls -la gtk4-stack-download/packaging/android-gtkmm4/.pixiewood/root/lib/ 2>/dev/null | head -20 || echo "root/lib not found"
          ls -la gtk4-stack-download/packaging/android-gtkmm4/.pixiewood/root/lib/arm64-v8a/ 2>/dev/null | head -20 || echo "root/lib/arm64-v8a not found"

      - name: Android NDK をセットアップ
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip -d /opt/
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r27b" >> "$GITHUB_ENV"

      - name: ビルド依存をインストール
        run: |
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            python3-pip curl xz-utils git \
            autoconf automake libtool gettext \
            glslc \
            libglib2.0-dev \
            libfreetype-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libtiff5-dev

      - name: Meson をセットアップ
        run: python3 -m pip install meson ninja

      - name: 互換ヘッダーを配置（リポジトリの compat/ を使用）
        run: |
          INSTALL=$GITHUB_WORKSPACE/android-install
          mkdir -p $INSTALL/include
          # Copy all compat headers except format (causes std::format ambiguity with stdlib)
          cp -r packaging/inkscape-full-android/compat/* $INSTALL/include/
          # Remove format header to avoid conflict with stdlib's std::format
          rm -f $INSTALL/include/format
          echo "Compatibility headers installed"

      - name: Inkscape ソースのパッチを適用
        run: |
          echo "=== Applying patches ==="

          # 1. cast.h: static_assert を削除
          sed -i '/static_assert(!sizeof(T), "check is always true");/d' src/util/cast.h
          sed -i '/static_assert(!sizeof(T), "check is always false");/d' src/util/cast.h
          sed -i '/static_assert(!sizeof(T), "cast is impossible");/d' src/util/cast.h

          # 2. variant-visitor.h: deduction guide を追加
          if ! grep -q "VariantVisitor(Fs...)" src/util/variant-visitor.h; then
            sed -i '/using Fs::operator()...;/a\\n    // Deduction guide for C++20 / clang compatibility\n    template <typename... Fs2>\n    VariantVisitor(Fs2...) -> VariantVisitor<Fs2...>;' src/util/variant-visitor.h
          fi

          # 3. dispatch-pool.cpp: cv.wait(stop_token) をポーリングに置換
          sed -i '/while (_available_cv.wait(lk, stop_token, \[&\] { return _available_work < _target_work; }))/{
            c\
            while (true) {\
                if (stop_token.stop_requested()) break;\
                if (_available_work >= _target_work) break;\
                _available_cv.wait_for(lk, std::chrono::milliseconds(10));\
            }\
            while (_available_work < _target_work) {\
                execute_batch(lk, id, thread_count);\
                if (stop_token.stop_requested()) break;\
                if (_available_work >= _target_work) break;\
                _available_cv.wait_for(lk, std::chrono::milliseconds(10));\
            }
          }' src/display/dispatch-pool.cpp

          # 4. measure-tool.cpp: vformat を Glib::ustring::compose に置換
          sed -i 's/std::vformat(_("Sub Path {}"), std::make_format_args(pth))/Glib::ustring::compose(_("Sub Path %1"), pth)/' src/ui/tools/measure-tool.cpp

          # 5. autotrace CMakeLists.txt - apply sed-based patch
          echo "=== Patching autotrace ==="
          echo "=== Current autotrace CMakeLists.txt before patch ==="
          head -80 src/3rdparty/autotrace/CMakeLists.txt
          # Insert cmake_minimum_required, project, and add_compile_definitions at the top
          sed -i '1i cmake_minimum_required(VERSION 3.12)\nproject(autotrace LANGUAGES C CXX)\nadd_compile_definitions(HAVE_CONFIG_H)' src/3rdparty/autotrace/CMakeLists.txt
          # Replace find_package(PkgConfig REQUIRED) and pkg_check_modules lines
          sed -i '/find_package(PkgConfig REQUIRED)/d' src/3rdparty/autotrace/CMakeLists.txt
          sed -i '/pkg_check_modules(GLIB REQUIRED IMPORTED_TARGET glib-2.0)/d' src/3rdparty/autotrace/CMakeLists.txt
          # Replace target_link_libraries line
          sed -i 's/target_link_libraries(autotrace_LIB PUBLIC PkgConfig::GLIB Intl::Intl)/target_link_libraries(autotrace_LIB PUBLIC GLIB::GLIB)/' src/3rdparty/autotrace/CMakeLists.txt
          echo "=== Autotrace patch applied ==="
          echo "=== Current autotrace CMakeLists.txt after patch ==="
          head -80 src/3rdparty/autotrace/CMakeLists.txt

          # 6. adaptagrams CMakeLists.txt
          sed -i '1i cmake_minimum_required(VERSION 3.12)\nproject(adaptagrams LANGUAGES CXX C)' src/3rdparty/adaptagrams/CMakeLists.txt

          # 7. 2geom CMakeLists.txt: Boost バージョン制約削除
          sed -i 's/find_package(Boost 1.60 CONFIG REQUIRED)/find_package(Boost CONFIG REQUIRED)/' src/3rdparty/2geom/CMakeLists.txt

          # 5b. 2geom tests - replace PkgConfig::GLIB with GLIB::GLIB
          echo "=== Patching 2geom tests ==="
          ls -la src/3rdparty/2geom/tests/CMakeLists.txt
          echo "=== Before patch ==="
          grep -n "PkgConfig::GLIB" src/3rdparty/2geom/tests/CMakeLists.txt || echo "Pattern not found before patch"
          
          # Use perl for more reliable replacement
          perl -pi -e 's/PkgConfig::GLIB/GLIB::GLIB/g' src/3rdparty/2geom/tests/CMakeLists.txt
          
          # Also patch the performance-tests using patch file
          echo "=== Patching 2geom performance-tests ==="
          ls -la src/3rdparty/2geom/src/performance-tests/CMakeLists.txt
          (cd src/3rdparty/2geom && patch -p1 < ../../../packaging/inkscape-full-android/patches/2geom-performance-tests.patch)
          
          # Also patch the tests/CMakeLists.txt with sed (more reliable)
          echo "=== Patching 2geom tests with sed ==="
          sed -i 's/PkgConfig::GLIB/GLIB::GLIB/g' src/3rdparty/2geom/tests/CMakeLists.txt
          
          # Verify the patch was applied
          echo "=== Verifying 2geom tests patch ==="
          grep -n "GLIB::GLIB" src/3rdparty/2geom/tests/CMakeLists.txt || echo "PATCH FAILED: GLIB::GLIB not found"
          grep -n "PkgConfig::GLIB" src/3rdparty/2geom/tests/CMakeLists.txt && echo "PATCH FAILED: PkgConfig::GLIB still present" || echo "PATCH SUCCESS: All PkgConfig::GLIB replaced"
          
          echo "=== Verifying 2geom performance-tests patch ==="
          grep -n "GLIB::GLIB" src/3rdparty/2geom/src/performance-tests/CMakeLists.txt || echo "PATCH FAILED: GLIB::GLIB not found in performance-tests"
          grep -n "PkgConfig::GLIB" src/3rdparty/2geom/src/performance-tests/CMakeLists.txt && echo "PATCH FAILED: PkgConfig::GLIB still present in performance-tests" || echo "PATCH SUCCESS: All PkgConfig::GLIB replaced in performance-tests"

          # 8. Make Potrace conditional on WITH_POTRACE
          sed -i 's/find_package(Potrace REQUIRED)/if(WITH_POTRACE)\n    find_package(Potrace REQUIRED)/' CMakeScripts/DefineDependsandFlags.cmake
          sed -i 's/list(APPEND INKSCAPE_LIBS Potrace::Potrace)/    list(APPEND INKSCAPE_LIBS Potrace::Potrace)\nendif()/' CMakeScripts/DefineDependsandFlags.cmake

          # 9. Skip harfbuzz-cairo pkg_check_modules - we provide it via CMake variables
          sed -i '/pkg_check_modules(HARFBUZZ_CAIRO IMPORTED_TARGET harfbuzz-cairo)/c\    set(HARFBUZZ_CAIRO_FOUND TRUE)\n    message("- Found '\''harfbuzz-cairo'\'' (provided via CMake variables)")\n    # Create the imported target that Inkscape CMakeLists.txt expects\n    add_library(PkgConfig::HARFBUZZ_CAIRO INTERFACE IMPORTED)\n    set_target_properties(PkgConfig::HARFBUZZ_CAIRO PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libharfbuzz-cairo.so"\n    )' CMakeScripts/DefineDependsandFlags.cmake

          # 10. Skip INKSCAPE_DEP (pixiewood target) - we provide dependencies manually
          sed -i '/pkg_check_modules(INKSCAPE_DEP REQUIRED IMPORTED_TARGET harfbuzz/,/lcms2)/c\    set(INKSCAPE_DEP_FOUND TRUE)\n    message("- Found '\''INKSCAPE_DEP'\'' (provided manually)")\n    # We manually add the libraries instead of using PkgConfig::INKSCAPE_DEP\n    list(APPEND INKSCAPE_LIBS \n        PkgConfig::CAIROMM\n        PkgConfig::PANGOMM\n        PkgConfig::GDK_PIXBUF\n        PkgConfig::GRAPHENE\n    )' CMakeScripts/DefineDependsandFlags.cmake

          # 11. Remove the INKSCAPE_DEP from INKSCAPE_LIBS
          sed -i '/list(APPEND INKSCAPE_LIBS PkgConfig::INKSCAPE_DEP)/d' CMakeScripts/DefineDependsandFlags.cmake

          # 12. Skip ICU_UC pkg_search_module - we provide it via CMake variables
          sed -i '/pkg_search_module(ICU_UC REQUIRED IMPORTED_TARGET icu-uc)/c\    set(ICU_UC_FOUND TRUE)\n    message("- Found '\''icu-uc'\'' (provided via CMake variables)")\n    add_library(PkgConfig::ICU_UC INTERFACE IMPORTED)\n    set_target_properties(PkgConfig::ICU_UC PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libicuuc.so"\n    )' CMakeScripts/DefineDependsandFlags.cmake

          # 13. Skip ICU_I18N pkg_search_module - we provide it via CMake variables
          sed -i '/pkg_search_module(ICU_I18N REQUIRED IMPORTED_TARGET icu-i18n)/c\    set(ICU_I18N_FOUND TRUE)\n    message("- Found '\''icu-i18n'\'' (provided via CMake variables)")\n    add_library(PkgConfig::ICU_I18N INTERFACE IMPORTED)\n    set_target_properties(PkgConfig::ICU_I18N PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libicui18n.so"\n    )' CMakeScripts/DefineDependsandFlags.cmake

          # 14. Add GLIB::GLIB target at top of DefineDependsandFlags.cmake for cross-compile
          echo "=== Patching DefineDependsandFlags.cmake for GLIB ==="
          patch -p1 < packaging/inkscape-full-android/patches/define-depends-glib.patch
          echo "=== GLIB patch applied ==="

          # 14. Skip find_package(Intl REQUIRED) - we provide it via CMake variables
          sed -i '/find_package(Intl REQUIRED)/c\    set(Intl_FOUND TRUE)\n    message("- Found '\''Intl'\'' (provided via CMake variables)")\n    add_library(Intl::Intl INTERFACE IMPORTED)\n    set_target_properties(Intl::Intl PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libintl.so"\n    )' CMakeScripts/DefineDependsandFlags.cmake

          # 15. Skip pkg_check_modules(MM ...) - we provide it via CMake variables (cairomm-1.16, pangomm-2.48, gdk-pixbuf-2.0, graphene-1.0)
          sed -i '/pkg_check_modules(/,/graphene-1.0)/c\    set(MM_FOUND TRUE)\n    message("- Found '\''MM'\'' (provided via CMake variables)")\n    # The individual targets are already added via INKSCAPE_DEP patch' CMakeScripts/DefineDependsandFlags.cmake

          # 15. Skip pkg_check_modules(GTK ...) - we provide it via CMake variables (skip pixiewood's GTK that creates PkgConfig::GLIB)
          sed -i '/pkg_check_modules(GTK IMPORTED_TARGET gtk4>=4.14.0)/c\    set(GTK_FOUND TRUE)\n    message("- Found '\''GTK'\'' (provided via CMake variables)")\n    # GTK dependencies are added via individual targets\n    list(APPEND INKSCAPE_LIBS \n        PkgConfig::GTKMM\n    )' CMakeScripts/DefineDependsandFlags.cmake

          # 16. Skip find_package for PNG/JPEG/ZLIB/TIFF/Freetype in capypdf - we provide via CMake variables
          sed -i '/find_package(PNG REQUIRED)/c\    # find_package(PNG REQUIRED) - skipped for Android cross-compile\n    set(PNG_FOUND TRUE)\n    message("- Found '\''PNG'\'' (provided via CMake variables)")\n    add_library(PNG::PNG INTERFACE IMPORTED)\n    set_target_properties(PNG::PNG PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libpng.so"\n    )' src/3rdparty/CMakeLists.txt
          sed -i '/find_package(JPEG REQUIRED)/c\    # find_package(JPEG REQUIRED) - skipped for Android cross-compile\n    set(JPEG_FOUND TRUE)\n    message("- Found '\''JPEG'\'' (provided via CMake variables)")\n    add_library(JPEG::JPEG INTERFACE IMPORTED)\n    set_target_properties(JPEG::JPEG PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libjpeg.so"\n    )' src/3rdparty/CMakeLists.txt
          sed -i '/find_package(ZLIB REQUIRED)/c\    # find_package(ZLIB REQUIRED) - skipped for Android cross-compile\n    set(ZLIB_FOUND TRUE)\n    message("- Found '\''ZLIB'\'' (provided via CMake variables)")\n    add_library(ZLIB::ZLIB INTERFACE IMPORTED)\n    set_target_properties(ZLIB::ZLIB PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libz.so"\n    )' src/3rdparty/CMakeLists.txt
          sed -i '/find_package(TIFF REQUIRED)/c\    # find_package(TIFF REQUIRED) - skipped for Android cross-compile\n    set(TIFF_FOUND TRUE)\n    message("- Found '\''TIFF'\'' (provided via CMake variables)")\n    add_library(TIFF::TIFF INTERFACE IMPORTED)\n    set_target_properties(TIFF::TIFF PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libtiff.so"\n    )' src/3rdparty/CMakeLists.txt
          sed -i '/find_package(Freetype REQUIRED)/c\    # find_package(Freetype REQUIRED) - skipped for Android cross-compile\n    set(FREETYPE_FOUND TRUE)\n    message("- Found '\''Freetype'\'' (provided via CMake variables)")\n    add_library(Freetype::Freetype INTERFACE IMPORTED)\n    set_target_properties(Freetype::Freetype PROPERTIES\n        INTERFACE_INCLUDE_DIRECTORIES "/home/runner/work/inkscape/inkscape/android-install/include"\n        INTERFACE_LINK_LIBRARIES "/home/runner/work/inkscape/inkscape/android-install/lib/libfreetype.so"\n    )' src/3rdparty/CMakeLists.txt

          echo "Patches applied"

      - name: 依存ライブラリをクロスコンパイル
        run: |
          echo "=== Building Inkscape Minimal Dependencies for Android ==="
          cd $GITHUB_WORKSPACE
          # Copy pixiewood from download dir to expected location
          # The artifact is downloaded to gtk4-stack-download/ with flat structure
          # The .pixiewood is at gtk4-stack-download/.pixiewood
          cp -r gtk4-stack-download/.pixiewood . 2>/dev/null || true
          # Also copy subprojects
          cp -r gtk4-stack-download/subprojects packaging/android-gtkmm4/ 2>/dev/null || true
          # Also copy bin-* directories if they exist
          cp -r gtk4-stack-download/bin-* packaging/android-gtkmm4/ 2>/dev/null || true
          # The .pixiewood directory is already at the correct location
          # (copied from the artifact to the workspace root)
          # Verify the pixiewood root directory exists
          echo "=== Verifying pixiewood structure ==="
          ls -la .pixiewood/ 2>/dev/null || echo ".pixiewood not found"
          ls -la .pixiewood/root/ 2>/dev/null || echo ".pixiewood/root not found"
          ls -la .pixiewood/root/include/glib-2.0/ 2>/dev/null | head -10 || echo ".pixiewood/root/include/glib-2.0 not found"
          ls -la .pixiewood/root/lib/arm64-v8a/ 2>/dev/null || echo ".pixiewood/root/lib/arm64-v8a not found"
          # Also check for glibmm headers in build directory
          ls -la .pixiewood/bin-aarch64/subprojects/glibmm-2.90.0/glib/glibmm/ 2>/dev/null | head -10 || echo "glibmm headers not found in build directory"
          
          # Create pkg-config wrapper for cross-compilation (needed for build-deps.sh)
          printf '#!/bin/bash\n# Use environment variables for cross-compile pkg-config\n# PKG_CONFIG_LIBDIR and PKG_CONFIG_PATH should be set in environment\nexec /usr/bin/pkg-config "$@"\n' > /usr/local/bin/pkg-config-cross
          chmod +x /usr/local/bin/pkg-config-cross
          
          bash packaging/inkscape-full-android/build-deps.sh \
            $GITHUB_WORKSPACE/android-install \
            /opt/android-ndk-r27b \
            31 \
            "$GITHUB_WORKSPACE/.pixiewood/bin-aarch64"

          # Debug: check pkg-config and glibmm AFTER build-deps.sh creates .pc files
          echo "=== Debug pkg-config (AFTER build-deps.sh) ==="
          which pkg-config || true
          which /usr/local/bin/pkg-config-cross || true
          echo "=== Checking .pc files (AFTER build-deps.sh) ==="
          ls -la $INSTALL/lib/pkgconfig/ 2>/dev/null | grep -i glibmm || echo "No glibmm .pc files found"
          ls -la $INSTALL/lib/pkgconfig/glibmm*.pc 2>/dev/null || echo "No glibmm .pc files found"
          /usr/local/bin/pkg-config-cross --list-all 2>/dev/null | grep -i glibmm || echo "glibmm not found in pkg-config"
          /usr/local/bin/pkg-config-cross --cflags --libs glibmm-2.68 2>&1 | head -5 || echo "glibmm-2.68 not found"
          /usr/local/bin/pkg-config-cross --cflags --libs glibmm-2.90 2>&1 | head -5 || echo "glibmm-2.90 not found"

      - name: Inkscape C++ コアをクロスコンパイル（フルビルド）
        run: |
          echo "=== Building Inkscape C++ Core for Android (FULL) ==="
          INSTALL=$GITHUB_WORKSPACE/android-install
          NDK=/opt/android-ndk-r27b
          API=31
          TRIPLE=aarch64-linux-android
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${TRIPLE}${API}-clang
          CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${TRIPLE}${API}-clang++
          JOBS=$(nproc)

          # CMake で Inkscape をビルド（Ninja generator 使用）
          cd $GITHUB_WORKSPACE
          # Clean build directory to ensure fresh configuration with updated flags
          rm -rf build-android-arm64
          mkdir -p build-android-arm64
          cd build-android-arm64

          # pixiewood + 手動ビルドの依存を pkg-config に見せる
          # IMPORTANT: Only use our install directory, NOT pixiewood's (their .pc files have wrong paths)
          export PKG_CONFIG_LIBDIR="$INSTALL/lib/pkgconfig"
          export PKG_CONFIG_PATH="$INSTALL/lib/pkgconfig"
          export PKG_CONFIG=/usr/local/bin/pkg-config-cross
          export CMAKE_PREFIX_PATH="$INSTALL"

          # Create pkg-config wrapper for cross-compilation
          # Use environment variables so they can be overridden
          printf '#!/bin/bash\n# Use environment variables for cross-compile pkg-config\n# PKG_CONFIG_LIBDIR and PKG_CONFIG_PATH should be set in environment\nexec /usr/bin/pkg-config "$@"\n' > /usr/local/bin/pkg-config-cross
          chmod +x /usr/local/bin/pkg-config-cross

          cmake .. \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/usr/local/bin/ninja \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" \
            -DCMAKE_STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            -DCMAKE_INSTALL_PREFIX=$INSTALL \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_C_FLAGS="-DANDROID -fPIC -I$INSTALL/include -I$INSTALL/include/freetype2 -I$INSTALL/include/libpng16 -I$INSTALL/include/libjpeg-turbo-3.1.1 -I$INSTALL/include/tiff-4.7.0/libtiff -I$INSTALL/include/glibmm-2.90" \
            -DCMAKE_CXX_FLAGS="-DANDROID -fPIC -I$INSTALL/include -I$INSTALL/include/freetype2 -I$INSTALL/include/libpng16 -I$INSTALL/include/libjpeg-turbo-3.1.1 -I$INSTALL/include/tiff-4.7.0/libtiff -I$INSTALL/include/glibmm-2.90 -std=c++20" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$INSTALL/lib -lc++_shared" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L$INSTALL/lib -lc++_shared" \
            -DPKG_CONFIG_EXECUTABLE=/usr/local/bin/pkg-config-cross \
            -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/packaging/inkscape-full-android/cmake" \
            -DCMAKE_PREFIX_PATH="$INSTALL" \
            -DCMAKE_FIND_ROOT_PATH="$INSTALL" \
            -DPNG_INCLUDE_DIR="$INSTALL/include/libpng16" \
            -DPNG_PNG_INCLUDE_DIR="$INSTALL/include/libpng16" \
            -DPNG_LIBRARY="$INSTALL/lib/libpng.so" \
            -DPNG_LIBRARY_RELEASE="$INSTALL/lib/libpng.so" \
            -DPNG_LIBRARY_DEBUG="$INSTALL/lib/libpng.so" \
            -DPNG_LIBRARY_MINSIZEREL="$INSTALL/lib/libpng.so" \
            -DPNG_LIBRARY_RELWITHDEBINFO="$INSTALL/lib/libpng.so" \
            -DZLIB_INCLUDE_DIR="$INSTALL/include" \
            -DZLIB_LIBRARY="$INSTALL/lib/libz.so" \
            -DZLIB_LIBRARY_RELEASE="$INSTALL/lib/libz.so" \
            -DZLIB_LIBRARY_DEBUG="$INSTALL/lib/libz.so" \
            -DJPEG_INCLUDE_DIR="$INSTALL/include/libjpeg-turbo-3.1.1" \
            -DJPEG_LIBRARY="$INSTALL/lib/libjpeg.so" \
            -DJPEG_LIBRARY_RELEASE="$INSTALL/lib/libjpeg.so" \
            -DJPEG_LIBRARY_DEBUG="$INSTALL/lib/libjpeg.so" \
            -DLIBXSLT_INCLUDE_DIR="$INSTALL/include" \
            -DLIBXSLT_LIBRARIES="$INSTALL/lib/libxslt.so" \
            -DLIBXML2_INCLUDE_DIR="$INSTALL/include/libxml2" \
            -DLIBXML2_LIBRARIES="$INSTALL/lib/libxml2.so" \
            -DTIFF_INCLUDE_DIR="$INSTALL/include/tiff-4.7.0/libtiff" \
            -DTIFF_LIBRARY="$INSTALL/lib/libtiff.so" \
            -DTIFF_LIBRARY_RELEASE="$INSTALL/lib/libtiff.so" \
            -DTIFF_LIBRARY_DEBUG="$INSTALL/lib/libtiff.so" \
            -DFREETYPE_INCLUDE_DIRS="$INSTALL/include/freetype2" \
            -DFREETYPE_LIBRARY="$INSTALL/lib/libfreetype.so" \
            -DFREETYPE_LIBRARY_RELEASE="$INSTALL/lib/libfreetype.so" \
            -DFREETYPE_LIBRARY_DEBUG="$INSTALL/lib/libfreetype.so" \
            -DHARFBUZZ_CAIRO_INCLUDE_DIR="$INSTALL/include" \
            -DHARFBUZZ_CAIRO_LIBRARY="$INSTALL/lib/libharfbuzz-cairo.so" \
            -DHAVE_HARFBUZZ_CAIRO=ON \
            -DCMAKE_FIND_LIBRARY_PREFIXES="" \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=".so" \
            -DCMAKE_DISABLE_FIND_PACKAGE_PNG=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_TIFF=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_FREETYPE=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_LIBXSLT=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_LIBXML2=ON \
            -DWITH_PYTHON=OFF \
            -DWITH_IMAGE_MAGICK=OFF \
            -DWITH_OPENMP=OFF \
            -DWITH_GSL=ON \
            -DWITH_LCMS=ON \
            -DWITH_DBUS=OFF \
            -DWITH_GNOME_VFS=OFF \
            -DWITH_POPPLER=OFF \
            -DWITH_POTRACE=OFF \
            -DWITH_VISIO=OFF \
            -DWITH_WPG=OFF \
            -DWITH_CDR=OFF \
            -DWITH_EMF=OFF \
            -DWITH_X11=OFF \
            -DWITH_XCB=OFF \
            -DWITH_NLS=OFF \
            -DWITH_PERL=OFF \
            -DWITH_LIBVISIO=OFF \
            -DWITH_LIBWPG=OFF \
            -DWITH_LIBCDR=OFF \
            -DWITH_LIBREVENGE=OFF \
            -DWITH_INTERNAL_DEPIXELIZE=ON \
            -DWITH_INTERNAL_AUTOTRACE=ON \
            -DWITH_INTERNAL_ADAPTAGRAMS=ON \
            -DWITH_INTERNAL_UEMF=ON \
            -DWITH_INTERNAL_2GEOM=ON \
            -DWITH_INTERNAL_CAPYPDF=ON \
            -DWITH_BOOST=ON \
            -DWITH_GTEST=OFF \
            -DWITH_GETTEXT=OFF \
            2>&1

          # フルビルド（全ターゲット）
          echo "=== Starting full Inkscape build ==="
          /usr/local/bin/ninja -j$JOBS 2>&1

          # 結果確認
          echo "=== Build artifacts ==="
          find $INSTALL -name "*.so" -o -name "*.a" | head -50
          find $GITHUB_WORKSPACE/build-android-arm64 -name "inkscape" -o -name "libinkscape*.so" 2>/dev/null | head -20

      - name: Inkscape 実行ファイルをコピー
        run: |
          find $GITHUB_WORKSPACE/build-android-arm64 -name "inkscape" -type f -exec cp {} $GITHUB_WORKSPACE/android-install/bin/ \; 2>/dev/null || true
          find $GITHUB_WORKSPACE/build-android-arm64 -name "libinkscape*.so" -type f -exec cp {} $GITHUB_WORKSPACE/android-install/lib/ \; 2>/dev/null || true

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: inkscape-full-android
          path: |
            android-install/**/*.so
            android-install/**/*.a
            android-install/bin/inkscape
          retention-days: 7
          if-no-files-found: warn