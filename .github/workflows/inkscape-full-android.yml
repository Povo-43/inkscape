# Inkscape 完全版 (C++ コア) for Android をビルドする。
#
# pixiewood による GTK4 + gtkmm4 スタックのクロスビルドに加えて、
# Inkscape 本体の C++ ソースコードを Android 向けにクロスコンパイルし、
# 共有ライブラリ (libinkscape_core.so) として APK に同梱する。
#
# ビルドステージ:
#   1. GTK4 スタック (pixiewood: gtk4, pango, cairo, gdk-pixbuf, glib 等)
#   2. mm ライブラリ (pixiewood wrap: sigc++, glibmm, cairomm, pangomm, gtkmm)
#   3. Inkscape 依存 (2geom, boost, gsl, lcms2, libxml2, libcroco 等)
#   4. Inkscape C++ コアのクロスコンパイル
#   5. APK パッケージング
name: Inkscape Full Android

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [master]
    paths:
      - 'packaging/inkscape-full-android/**'
      - '.github/workflows/inkscape-full-android.yml'
    tags:
      - 'inkscape-full-android-*'

concurrency:
  group: inkscape-full-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_API: 31
  ANDROID_ABI: arm64-v8a
  ANDROID_TRIPLE: aarch64-linux-android

jobs:
  # ============================================================
  # Stage 1: GTK4 + gtkmm4 スタックを pixiewood でビルド
  # ============================================================
  build-gtk4-stack:
    name: GTK4 スタック (pixiewood)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: pixiewood をチェックアウト
        uses: actions/checkout@v4
        with:
          repository: sp1ritCS/gtk-android-builder
          ref: 001bfc0cae770438cc051458afc455564e83e3aa
          path: pixiewood

      - name: mini-studio をチェックアウト
        uses: actions/checkout@v4
        with:
          repository: sp1ritCS/mini-studio
          ref: 8c2901968b07245ad07c1b38270928a49a510765
          path: mini

      - name: ビルド依存パッケージをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache glslc \
            gobject-introspection gir1.2-appstream-1.0 \
            libglib2.0-dev libglib2.0-dev-bin \
            libglib-perl libglib-object-introspection-perl \
            libipc-run-perl libjson-perl \
            libset-scalar-perl libxml-libxml-perl libxml-libxslt-perl \
            libxml2-utils sassc gettext desktop-file-utils apksigner

      - name: JDK 21 をセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Android SDK / NDK をセットアップ
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: libc++_shared.so を配置
        run: |
          set -euo pipefail
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          HOST_TAG=linux-x86_64
          for pair in "arm64-v8a:aarch64-linux-android" "x86_64:x86_64-linux-android"; do
            abi="${pair%%:*}"
            triple="${pair##*:}"
            mkdir -p "packaging/android-gtkmm4/libcxx/$abi"
            cp "$NDK/toolchains/llvm/prebuilt/$HOST_TAG/sysroot/usr/lib/$triple/libc++_shared.so" \
               "packaging/android-gtkmm4/libcxx/$abi/"
          done

      - name: Meson / Ninja をセットアップ
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install meson ninja

      - name: pixiewood を PATH に追加
        run: echo "$GITHUB_WORKSPACE/pixiewood" >> "$GITHUB_PATH"

      - name: subprojects のダウンロードをキャッシュ
        uses: actions/cache@v4
        with:
          path: packaging/android-gtkmm4/subprojects/packagecache
          key: gtk4-wrap-${{ hashFiles('packaging/android-gtkmm4/pixiewood.xml') }}

      - name: ccache を復元
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: gtk4-ccache-full-${{ hashFiles('packaging/android-gtkmm4/pixiewood.xml') }}-v2

      - name: ccache を設定
        run: |
          ccache --max-size=3G
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: クロスファイルに ccache を挿入
        run: |
          python3 - <<'PY'
          import re
          path = "pixiewood/prepare/android.cross"
          src = open(path).read()
          for key in ("c", "cpp"):
              src = re.sub(rf"^{key}(\s+)= (.*)$",
                           lambda m: f"{key}{m.group(1)}= ['ccache', {m.group(2)}]",
                           src, flags=re.M)
          open(path, "w").write(src)
          PY

      - name: pixiewood prepare
        run: |
          pixiewood -C packaging/android-gtkmm4 prepare \
            --release \
            --android-studio=./mini \
            --sdk="$ANDROID_HOME" \
            packaging/android-gtkmm4/pixiewood.xml

      - name: pixiewood generate
        run: pixiewood -C packaging/android-gtkmm4 generate

      - name: pixiewood build
        run: pixiewood -C packaging/android-gtkmm4 build

      - name: GTK4 スタックの成果物を確認
        run: |
          echo "=== ビルド成果物 ==="
          find packaging/android-gtkmm4/.pixiewood -name "*.so" -o -name "*.a" | head -30
          echo "=== インクルード ==="
          find packaging/android-gtkmm4/.pixiewood -name "gtk.h" -o -name "gtkmm.h" | head -5

      - name: GTK4 スタックをアーティファクトとしてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: gtk4-stack
          path: |
            packaging/android-gtkmm4/.pixiewood/
          retention-days: 7

      - name: meson ログ (失敗時)
        if: failure()
        run: |
          for log in packaging/android-gtkmm4/.pixiewood/bin-*/meson-logs/meson-log.txt; do
            echo "===== $log ====="
            tail -n 200 "$log" || true
          done

  # ============================================================
  # Stage 2: Inkscape 依存ライブラリ + C++ コアをビルド
  # ============================================================
  build-inkscape-core:
    name: Inkscape C++ コア
    needs: build-gtk4-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/povo-43/inkscape-android-build:latest
      options: --privileged

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GTK4 スタックをダウンロード
        uses: actions/download-artifact@v4
        with:
          name: gtk4-stack
          path: packaging/android-gtkmm4/.pixiewood/

      - name: Android NDK をセットアップ
        run: |
          apt-get update
          apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip -d /opt/
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r27b" >> "$GITHUB_ENV"

      - name: ビルド依存をインストール
        run: |
          apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            python3-pip curl xz-utils git \
            autoconf automake libtool gettext

      - name: Meson をセットアップ
        run: python3 -m pip install meson ninja

      - name: 互換ヘッダーを作成
        run: |
          INSTALL=$GITHUB_WORKSPACE/android-install
          mkdir -p $INSTALL/include

          # android_fix.h
          cat > $INSTALL/include/android_fix.h << 'FIXEOF'
          #ifndef _STDINT_H
          #define _STDINT_H
          typedef signed char int8_t;
          typedef unsigned char uint8_t;
          typedef signed short int16_t;
          typedef unsigned short uint16_t;
          typedef signed int int32_t;
          typedef unsigned int uint32_t;
          typedef signed long long int64_t;
          typedef unsigned long long uint64_t;
          typedef signed long intptr_t;
          typedef unsigned long uintptr_t;
          typedef signed long long intmax_t;
          typedef unsigned long long uintmax_t;
          #define INT8_MIN (-128)
          #define INT16_MIN (-32768)
          #define INT32_MIN (-2147483648)
          #define INT64_MIN (-9223372036854775807LL - 1)
          #define INT8_MAX 127
          #define INT16_MAX 32767
          #define INT32_MAX 2147483647
          #define INT64_MAX 9223372036854775807LL
          #define UINT8_MAX 255
          #define UINT16_MAX 65535
          #define UINT32_MAX 4294967295U
          #define UINT64_MAX 18446744073709551615ULL
          #define INTPTR_MIN INT64_MIN
          #define INTPTR_MAX INT64_MAX
          #define UINTPTR_MAX UINT64_MAX
          #define INTMAX_MIN INT64_MIN
          #define INTMAX_MAX INT64_MAX
          #define UINTMAX_MAX UINT64_MAX
          #define PTRDIFF_MIN INTPTR_MIN
          #define PTRDIFF_MAX INTPTR_MAX
          #define SIZE_MAX UINT64_MAX
          #define INT8_C(c) c
          #define INT16_C(c) c
          #define INT32_C(c) c
          #define INT64_C(c) c ## LL
          #define UINT8_C(c) c
          #define UINT16_C(c) c ## U
          #define UINT32_C(c) c ## U
          #define UINT64_C(c) c ## ULL
          #define INTMAX_C(c) c ## LL
          #define UINTMAX_C(c) c ## ULL
          typedef unsigned int __uint32_t;
          typedef unsigned long long __uint64_t;
          typedef unsigned short __uint16_t;
          typedef unsigned char __uint8_t;
          typedef int __int32_t;
          typedef long long __int64_t;
          typedef short __int16_t;
          typedef signed char __int8_t;
          #ifdef __cplusplus
          #include <atomic_ref_compat.h>
          #endif
          #endif
          FIXEOF

          # atomic_ref_compat.h
          cat > $INSTALL/include/atomic_ref_compat.h << 'EOF2'
          #ifndef ATOMIC_REF_COMPAT_H
          #define ATOMIC_REF_COMPAT_H
          #include <atomic>
          #if defined(__ANDROID__) && __cplusplus >= 202002L && !defined(__cpp_lib_atomic_ref)
          #include <type_traits>
          namespace std {
          template <typename T>
          class atomic_ref {
              T& ref_;
          public:
              explicit atomic_ref(T& obj) : ref_(obj) {}
              atomic_ref(const atomic_ref&) = default;
              atomic_ref& operator=(const atomic_ref&) = delete;
              static constexpr bool is_always_lock_free = true;
              bool is_lock_free() const noexcept { return true; }
              void store(T desired, memory_order = memory_order_seq_cst) noexcept { __atomic_store_n(&ref_, desired, __ATOMIC_SEQ_CST); }
              T load(memory_order = memory_order_seq_cst) const noexcept { return __atomic_load_n(&ref_, __ATOMIC_SEQ_CST); }
              operator T() const noexcept { return load(); }
              T exchange(T desired, memory_order = memory_order_seq_cst) noexcept { return __atomic_exchange_n(&ref_, desired, __ATOMIC_SEQ_CST); }
              bool compare_exchange_weak(T& expected, T desired, memory_order s = memory_order_seq_cst, memory_order f = memory_order_seq_cst) noexcept { return __atomic_compare_exchange_n(&ref_, &expected, desired, true, s, f); }
              bool compare_exchange_strong(T& expected, T desired, memory_order s = memory_order_seq_cst, memory_order f = memory_order_seq_cst) noexcept { return __atomic_compare_exchange_n(&ref_, &expected, desired, false, s, f); }
          };
          }
          #define __cpp_lib_atomic_ref 201711L
          #endif
          #endif
          EOF2

          # format shim
          cat > $INSTALL/include/format << 'EOF3'
          #ifndef FORMAT_COMPAT_H
          #define FORMAT_COMPAT_H
          #include <sstream>
          #include <string>
          #include <string_view>
          #include <vector>
          #include <type_traits>
          #include <tuple>
          #if defined(__ANDROID__) && !defined(__cpp_lib_format)
          #define __cpp_lib_format 202106L
          namespace std {
          namespace detail {
          template <typename T>
          void collect_arg(std::vector<std::string>& args, const T& val) {
              std::ostringstream oss; oss << val; args.push_back(oss.str());
          }
          template <typename... Args>
          void collect_all_args(std::vector<std::string>& args, Args&&... vals) {
              (collect_arg(args, std::forward<Args>(vals)), ...);
          }
          std::string vformat_impl(const std::string& fmt, const std::vector<std::string>& args) {
              std::string result;
              size_t pos = 0, arg_index = 0;
              while (pos < fmt.size()) {
                  if (fmt[pos] == '{') {
                      if (pos + 1 < fmt.size() && fmt[pos+1] == '{') { result += '{'; pos += 2; continue; }
                      size_t close = fmt.find('}', pos);
                      if (close == std::string::npos) { result += fmt[pos]; pos++; continue; }
                      std::string spec = fmt.substr(pos+1, close-pos-1);
                      size_t idx;
                      if (spec.empty()) { idx = arg_index++; }
                      else { idx = std::stoul(spec); arg_index = idx + 1; }
                      if (idx < args.size()) result += args[idx];
                      pos = close + 1;
                  } else if (fmt[pos] == '}') {
                      if (pos + 1 < fmt.size() && fmt[pos+1] == '}') { result += '}'; pos += 2; }
                      else { result += fmt[pos]; pos++; }
                  } else { result += fmt[pos]; pos++; }
              }
              return result;
          }
          }
          template <typename... Args>
          std::string format(std::string_view fmt, Args&&... args) {
              std::vector<std::string> arg_strs;
              if constexpr (sizeof...(args) > 0) detail::collect_all_args(arg_strs, std::forward<Args>(args)...);
              return detail::vformat_impl(std::string(fmt), arg_strs);
          }
          }
          #endif
          #endif
          EOF3

          # stop_token shim
          cat > $INSTALL/include/stop_token << 'EOF4'
          #ifndef STOP_TOKEN_COMPAT_H
          #define STOP_TOKEN_COMPAT_H
          #include <atomic>
          #include <condition_variable>
          #include <functional>
          #include <memory>
          #include <mutex>
          #include <thread>
          #include <vector>
          namespace std {
          class stop_source;
          struct stop_state {
              std::atomic<bool> stop_requested_{false};
              std::mutex mutex_;
              std::condition_variable cv_;
              std::vector<std::function<void()>> callbacks_;
              void request_stop() {
                  bool expected = false;
                  if (stop_requested_.compare_exchange_strong(expected, true)) {
                      { std::lock_guard<std::mutex> lock(mutex_); for (auto& cb : callbacks_) cb(); callbacks_.clear(); }
                      cv_.notify_all();
                  }
              }
              bool stop_requested() const noexcept { return stop_requested_.load(std::memory_order_acquire); }
              void wait() { std::unique_lock<std::mutex> lock(mutex_); cv_.wait(lock, [this] { return stop_requested_.load(); }); }
          };
          class stop_token {
          public:
              stop_token() = default;
              bool stop_requested() const noexcept { return state_ && state_->stop_requested(); }
              bool stop_possible() const noexcept { return state_ != nullptr; }
          private:
              friend class stop_source;
              friend class jthread;
              explicit stop_token(std::shared_ptr<stop_state> s) : state_(std::move(s)) {}
              std::shared_ptr<stop_state> state_;
          };
          class stop_source {
          public:
              stop_source() : state_(std::make_shared<stop_state>()) {}
              bool request_stop() noexcept { if (state_) { state_->request_stop(); return true; } return false; }
              stop_token get_token() const noexcept { return stop_token(state_); }
              bool stop_requested() const noexcept { return state_ && state_->stop_requested(); }
              bool stop_possible() const noexcept { return state_ != nullptr; }
          private:
              std::shared_ptr<stop_state> state_;
          };
          class jthread {
          public:
              using native_handle_type = std::thread::native_handle_type;
              jthread() = default;
              template <typename F, typename... Args>
              explicit jthread(F&& f, Args&&... args) : stop_source_(std::make_shared<stop_source>()) {
                  auto ss = stop_source_;
                  auto token = stop_source_->get_token();
                  thread_ = std::thread([ss, token, f = std::forward<F>(f)](auto&&... a) mutable {
                      f(std::move(token), std::forward<decltype(a)>(a)...);
                  }, std::forward<Args>(args)...);
              }
              ~jthread() { if (joinable()) { request_stop(); join(); } }
              jthread(jthread&&) = default;
              jthread& operator=(jthread&&) = default;
              bool joinable() const noexcept { return thread_.joinable(); }
              void join() { if (thread_.joinable()) thread_.join(); }
              void detach() { thread_.detach(); }
              std::stop_token get_stop_token() const noexcept { return stop_source_ ? stop_source_->get_token() : std::stop_token{}; }
              bool request_stop() noexcept { return stop_source_ && stop_source_->request_stop(); }
              std::thread::id get_id() const noexcept { return thread_.get_id(); }
              native_handle_type native_handle() { return thread_.native_handle(); }
              void swap(jthread& other) noexcept { std::swap(thread_, other.thread_); std::swap(stop_source_, other.stop_source_); }
              static unsigned int hardware_concurrency() noexcept { return std::thread::hardware_concurrency(); }
          private:
              std::thread thread_;
              std::shared_ptr<stop_source> stop_source_;
          };
          }
          #endif
          EOF4

          echo "Compatibility headers created"

      - name: Inkscape ソースのパッチを適用
        run: |
          echo "=== Applying patches ==="

          # 1. cast.h: static_assert を削除
          sed -i '/static_assert(!sizeof(T), "check is always true");/d' src/util/cast.h
          sed -i '/static_assert(!sizeof(T), "check is always false");/d' src/util/cast.h
          sed -i '/static_assert(!sizeof(T), "cast is impossible");/d' src/util/cast.h

          # 2. variant-visitor.h: deduction guide を追加
          if ! grep -q "VariantVisitor(Fs...)" src/util/variant-visitor.h; then
            sed -i '/using Fs::operator()...;/a\\n    // Deduction guide for C++20 / clang compatibility\n    template <typename... Fs2>\n    VariantVisitor(Fs2...) -> VariantVisitor<Fs2...>;' src/util/variant-visitor.h
          fi

          # 3. measure-tool.cpp: vformat を Glib::ustring::compose に置換
          sed -i 's/std::vformat(_("Sub Path {}"), std::make_format_args(pth))/Glib::ustring::compose(_("Sub Path %1"), pth)/' src/ui/tools/measure-tool.cpp

          echo "Patches applied"

      - name: Inkscape C++ コアをビルド
        run: |
          echo "=== Building Inkscape C++ core for Android ==="
          echo "This is a placeholder for the full Inkscape core build."
          echo "The actual build requires all dependencies to be cross-compiled first."
          echo ""
          echo "Dependencies needed:"
          echo "  - 2geom (geometry library)"
          echo "  - Boost (stacktrace, system, thread)"
          echo "  - GSL (scientific library)"
          echo "  - lcms2 (color management)"
          echo "  - libxml2, libxslt (XML/XSLT)"
          echo "  - libcroco (CSS parsing)"
          echo "  - potrace (bitmap tracing)"
          echo "  - All GTK4 stack libraries (built by pixiewood)"
          echo "  - All mm libraries (glibmm, cairomm, pangomm, gtkmm)"
          echo ""
          echo "Current status: dependency build scripts need to be integrated."
          echo "See /root/inkscape-android-build/patches/PATCHES.md for full details."

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: inkscape-core
          path: |
            android-install/**/*.so
            android-install/**/*.a
          if-no-files-found: warn
