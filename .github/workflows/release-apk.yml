name: Release APK

on:
  # リリースが公開された時（既存リリースにアセットを追加）
  release:
    types: [published]
  # タグが push された時（リリース未作成の場合は自動でリリースを作成）
  push:
    tags:
      - 'inkscape-android-*'
  # 手動実行も許可（動作確認用）
  workflow_dispatch:

jobs:
  build-apk:
    name: APK ビルド
    runs-on: ubuntu-latest
    permissions:
      contents: write   # リリース作成・アセットアップロードに必要

    steps:
      # ------------------------------------------------------------------
      # a. リポジトリをチェックアウト（タグも取得するため fetch-depth: 0）
      # ------------------------------------------------------------------
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # b. JDK 17 セットアップ（Temurin）
      # ------------------------------------------------------------------
      - name: JDK 17 をセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ------------------------------------------------------------------
      # c. Android SDK セットアップ（platform 35 / build-tools 34 / NDK / CMake）
      # ------------------------------------------------------------------
      - name: Android SDK をセットアップ
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;34.0.0 cmake;3.22.1 ndk;26.3.11579264'

      # ------------------------------------------------------------------
      # d. Gradle セットアップ＋キャッシュ
      # ------------------------------------------------------------------
      - name: Gradle をセットアップしキャッシュを有効化
        uses: gradle/actions/setup-gradle@v3

      # ------------------------------------------------------------------
      # e. gradlew に実行権限付与
      # ------------------------------------------------------------------
      - name: gradlew に実行権限を付与
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # f. APK ビルド（デフォルトはデバッグビルド。
      #    ストア公開用リリースには RELEASE_* シークレットを設定し、
      #    こちらを :app:assembleRelease に切り替えてください）
      # ------------------------------------------------------------------
      - name: デバッグAPKをビルド
        run: ./gradlew :app:assembleDebug

      # ------------------------------------------------------------------
      # g. ビルド成果物の確認
      # ------------------------------------------------------------------
      - name: ビルド成果物を確認
        id: check-artifact
        run: |
          APK_PATH=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "APK が見つかりませんでした" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK: $APK_PATH"

      # ------------------------------------------------------------------
      # h. アップロード対象のタグ名を決定
      #    release イベント → 既存リリースのタグ
      #    push イベント   → push されたタグ
      #    workflow_dispatch → 最新タグ（なければ HEAD で新規リリース作成用のタグ名を生成）
      # ------------------------------------------------------------------
      - name: アップロード対象のタグ名を決定
        id: determine-tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            # workflow_dispatch: 最新の inkscape-android-* タグを使用
            TAG=$(git tag --list 'inkscape-android-*' --sort=-version:refname | head -n1)
            if [ -z "$TAG" ]; then
              # タグが存在しなければ HEAD に新規リリースを作成するためのタグ名を生成
              TAG="inkscape-android-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
              echo "新規タグ名を生成しました: $TAG"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "タグ: $TAG"

      # ------------------------------------------------------------------
      # i. GitHub REST API でリリースを作成（存在しなければ）
      #    release（published）イベントではリリースが既に存在するためスキップ
      # ------------------------------------------------------------------
      - name: リリースを作成（存在しなければ）
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.determine-tag.outputs.tag }}"
          # リリースの存在を確認（tags/{tag} エンドポイント）
          if gh api "/repos/${{ github.repository }}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "リリース ${TAG} は既に存在します（作成をスキップ）"
          else
            # リリースを作成
            gh api -X POST "/repos/${{ github.repository }}/releases" \
              -f tag_name="${TAG}" \
              -f name="Inkscape Android ${TAG}" \
              -f body="GitHub Actions による自動ビルド APK"
            echo "リリース ${TAG} を作成しました"
          fi

      # ------------------------------------------------------------------
      # j. アップロード前に APK の存在を確認
      # ------------------------------------------------------------------
      - name: アップロード対象 APK の存在を確認
        id: verify-apk
        run: |
          APK_PATH="${{ steps.check-artifact.outputs.apk_path }}"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK が見つかりません: $APK_PATH" >&2
            exit 1
          fi
          echo "APK 確認済み: $APK_PATH"

      # ------------------------------------------------------------------
      # k. GitHub REST API でリリースアセットをアップロード
      # ------------------------------------------------------------------
      - name: リリースアセットをアップロード
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.determine-tag.outputs.tag }}"
          APK_PATH="${{ steps.check-artifact.outputs.apk_path }}"
          # アセット名はファイル名をそのまま使用（inkscape-<tag>.apk にリネーム）
          cp "$APK_PATH" "inkscape-${TAG}.apk"

          # リリース ID を取得
          RELEASE_ID=$(gh api "/repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id')
          echo "リリース ID: $RELEASE_ID"

          # GitHub Uploads API でアセットを直接アップロード（gh api の -f file はマルチパートになりアセットアップロードに不向きなため curl を使用）
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"inkscape-${TAG}.apk" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=inkscape-${TAG}.apk"

          echo "アセットをアップロードしました: inkscape-${TAG}.apk"
