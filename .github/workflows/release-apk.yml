name: Release APK

on:
  # リリースが公開された時
  release:
    types: [published]
  # タグが push された時（gh release などでタグ付きリリースを作成した際に起動）
  push:
    tags:
      - 'inkscape-android-*'
  # 手動実行も許可（動作確認用）
  workflow_dispatch:

jobs:
  build-apk:
    name: APK ビルド
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # a. リポジトリをチェックアウト（タグも取得するため fetch-depth: 0）
      # ------------------------------------------------------------------
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # b. JDK 17 セットアップ（Temurin）
      # ------------------------------------------------------------------
      - name: JDK 17 をセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ------------------------------------------------------------------
      # c. Android SDK セットアップ（platform 35 / build-tools 34 / NDK / CMake）
      # ------------------------------------------------------------------
      - name: Android SDK をセットアップ
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;34.0.0 cmake;3.22.1 ndk;26.3.11579264'

      # ------------------------------------------------------------------
      # d. Gradle セットアップ＋キャッシュ
      # ------------------------------------------------------------------
      - name: Gradle をセットアップしキャッシュを有効化
        uses: gradle/actions/setup-gradle@v3

      # ------------------------------------------------------------------
      # e. gradlew に実行権限付与
      # ------------------------------------------------------------------
      - name: gradlew に実行権限を付与
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # f. APK ビルド（デフォルトはデバッグビルド。
      #    ストア公開用リリースには RELEASE_* シークレットを設定し、
      #    こちらを :app:assembleRelease に切り替えてください）
      # ------------------------------------------------------------------
      - name: デバッグAPKをビルド
        run: ./gradlew :app:assembleDebug

      # ------------------------------------------------------------------
      # g. ビルド成果物の確認
      # ------------------------------------------------------------------
      - name: ビルド成果物を確認
        id: check-artifact
        run: |
          APK_PATH=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "APK が見つかりませんでした" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK: $APK_PATH"

      # ------------------------------------------------------------------
      # h. GitHub リリースへアセットアップロード
      # ------------------------------------------------------------------
      - name: リリースアセットをアップロード
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          ASSET_NAME="inkscape-${TAG}.apk"
          gh release upload "${TAG}" "${{ steps.check-artifact.outputs.apk_path }}" --name "${ASSET_NAME}" --clobber
